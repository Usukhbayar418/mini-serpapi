name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.313.0
        with:
          bundler-cache: true

      - name: Set up test database 
        run: bin/rails db:test:prepare       
        env:                                 
          RAILS_ENV: test       

      - name: Run RSpec tests
        run: bundle exec rspec